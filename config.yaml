# Brainrot bot settings. Every line is optional: delete one and the default is used.
# Restart the bot after changing anything here.

folders:
  clips: clips          # make a subfolder in here for each podcast / video and drop the clips inside
  gameplay: gameplay    # your gameplay recordings (Minecraft, parkour, Subway Surfers...). Picked at random.
  music: music          # optional quiet background music. Leave the folder empty for none.
  output: output        # finished reels appear here, in the same subfolders as the clips

watch:
  poll_seconds: 10      # how often to look for new clips
  settle_seconds: 10    # a new file must stop changing for this long first (so half-copied files are never used)
  max_attempts: 3       # a clip that keeps failing is skipped after this many tries
  low_priority: true    # render at low CPU priority so your PC stays smooth

video:
  width: 1080           # 1080 x 1920 = vertical 9:16 (TikTok / Reels / Shorts)
  height: 1920
  fps: 30
  top_ratio: 0.3333     # the clip gets the top third, the gameplay the bottom two thirds
  snap_top: true        # if the clip almost fits the top area (16:9 clips do), size the area to fit it exactly
  top_fill: blur        # what fills empty space around a clip that doesn't fill its area: blur or black
  layout: split         # split = clip on top, gameplay below | floating = gameplay full screen, clip as a card on top
                        # fullscreen = only the clip, cropped to follow the speaker's face
                        # side = clip left, gameplay right (for landscape videos: set width 1920 and height 1080)
  codec: libx264        # h264_nvenc (NVIDIA), h264_videotoolbox (Mac) or h264_qsv (Intel) render faster
  crf: 19               # libx264 quality: lower = better quality, bigger file (18-23 is a good range)
  preset: medium        # libx264 speed: faster / medium / slow
  bitrate: 12M          # max bitrate for libx264 (keeps files uploadable), target bitrate for hardware codecs
  audio_bitrate: 192k
  extra_args: []        # extra ffmpeg output options, for experts

gameplay:
  skip_start: 0         # ignore the first N seconds of every recording (loading screens, menus)
  skip_end: 0           # ignore the last N seconds
  mirror: false         # randomly mirror the gameplay left-right, so reused footage looks fresh

captions:
  enabled: true
  style: classic        # classic (the look below) | hormozi | mrbeast | minimal | karaoke - other styles replace the look settings
  model: small          # speech model: tiny, base, small, medium, large-v3, turbo (bigger = more accurate, slower)
  language: auto        # auto, or a code like en, ar, fr, es, de
  device: auto          # auto uses an NVIDIA GPU if one works, otherwise the CPU
  font: Montserrat Black  # bundled in fonts/. Any font installed on your computer works too.
  font_size: 100
  uppercase: true
  remove_punctuation: true   # drops . , : ; quotes (keeps ? and !)
  max_words: 3          # words on screen at once (1 = one word at a time)
  max_chars: 18         # start a new caption before a line gets longer than this
  color: "#FFD400"      # yellow text
  stroke_color: "#FFFFFF"  # white outline
  stroke_width: 7
  shadow_color: "#000000"  # soft drop shadow
  shadow_opacity: 0.6   # 0 = no shadow, 1 = solid
  shadow_offset: 6
  shadow_blur: 7
  position: 0.5         # height on screen: 0 = top, 0.5 = middle, 1 = bottom
  animation: pop        # pop = each caption bounces in, none = no animation
  highlight_color: ""   # e.g. "#00FF66" to color the word being spoken right now. Empty = off.
  keyword_color: "#39FF6A"  # important words (money, numbers, "never", "secret"...) in this color. Empty = off.
  save_srt: true        # also save a normal .srt subtitle file next to each reel (for YouTube uploads)
  translate_to: []      # e.g. [es, ar]: also make each reel with captions in these languages (needs the AI key)

edit:
  cut_silences: true    # remove pauses: silences longer than max_pause are cut (laughter and reactions are kept)
  max_pause: 0.45
  zoom: true            # quick punch-in zooms on the most important moments
  zoom_amount: 1.15
  face_tracking: true   # zooms (and the fullscreen layout) aim at the speaker's face
  sfx: true             # whoosh on zooms, "boom" on punchlines, pop on emojis
  sfx_volume: 0.6
  emojis: true          # an emoji above the caption when a word matches (money -> 💰, fire -> 🔥 ...)
  emoji_size: 150
  censor: false         # hide swear words: bleep in the audio and F*** in the captions
  censor_words: []      # extra words to hide, e.g. ["word1", "word2"]
  censor_mode: bleep    # bleep or mute
  thumbnail: true       # save a cover picture (.jpg) next to every reel

hook:
  # A title box at the start of the reel. Text comes from a .txt file with the same name as the clip
  # (my_clip.mp4 -> my_clip.txt), or title.txt in the clip's folder for all clips in that folder.
  enabled: true
  auto: true            # no title file? Write a hook from what is said (with AI when connected)
  duration: 4           # seconds on screen (0 = the whole video)
  font: Montserrat Black
  font_size: 60
  text_color: "#000000"
  box_color: "#FFFFFF"

progress_bar:
  enabled: true         # thin bar on the line between clip and gameplay that fills up as the reel plays
  color: "#FFD400"
  height: 10

audio:
  normalize: true       # make every reel equally loud (like the big accounts do)
  loudness: -14         # LUFS. -14 is what TikTok / YouTube / Instagram aim for.
  music_volume: 0.12    # background music level (only used if the music folder has tracks)
  music_duck: true      # music gets quieter while someone talks

parts:
  max_seconds: 0        # 0 = off. e.g. 90: longer clips are cut at pauses into Part 1/2/3 reels of at most 90s

moments:
  # Long videos (whole podcast episodes): instead of using everything, the bot finds the best moments
  # and makes a reel of each one (with AI when connected, otherwise with built-in rules).
  enabled: true
  min_source_minutes: 5 # videos at least this long are treated as long videos
  count: 0              # reels per long video (0 = automatic: about one per 8 minutes)
  max_count: 12
  min_seconds: 20       # length of each moment
  max_seconds: 60

links:
  # Put video links (YouTube, TikTok, Instagram, X...) in a links.txt file inside a clips folder, one per line,
  # or add them from the menu. Each video is downloaded into that folder and becomes reels like any clip.
  enabled: true
  max_height: 1080      # download quality
  playlist_limit: 5     # a playlist or channel link downloads at most this many videos
  cookies_file: ''      # for videos that need a login: browser cookies saved as cookies.txt (next to this file by default)

ai:
  # Claude (Anthropic API) picks the best moments, writes hooks, titles, captions and hashtags, and translates.
  # Connect a key in the menu (AI). Without a key everything still works with the built-in rules.
  enabled: true
  model: claude-opus-5
  moments: true         # let the AI pick the moments of long videos
  copy: true            # let the AI write hooks, titles, captions and hashtags

dedupe:
  enabled: true         # skip videos that were already turned into reels (renamed copies, re-downloads, re-uploads)
  similarity: 0.7       # how alike two transcripts must be to count as the same video (0.3-1)

tools:
  # Only needed if ffmpeg isn't found automatically. Use single quotes, e.g. 'C:\ffmpeg\bin\ffmpeg.exe'
  ffmpeg: ''
  ffprobe: ''

app:
  # The setup wizard fills these in. Run the app again and pick "Settings" to change them.
  run_mode: background  # background = keeps working 24/7 after you close the window, window = stops when it closes
  autostart: false      # start by itself when you log in to the computer
  autostart_delay: 15   # seconds to wait after login before starting
  setup_done: false

upload:
  # Auto-posting. Connect accounts in the setup wizard; the keys are stored separately (encrypted on Windows).
  youtube: false        # YouTube Shorts
  tiktok: false
  instagram: false      # Instagram Reels
  facebook: false       # Facebook Page Reels (3-90 second reels only)
  hours_between_posts: 3   # space out posts on each platform (0 = post as soon as a reel is ready)
  hashtags: "#fyp #viral #podcast"   # added to every post. A hashtags.txt in a clip folder adds more.
  post_translations: false  # also post the translated reels (captions.translate_to)
  youtube_privacy: public  # public, unlisted or private. Until your Google project passes YouTube's audit, uploads are locked private.
  youtube_category: 24     # 24 = Entertainment, 27 = Education, 22 = People & Blogs
  tiktok_mode: draft       # draft = lands in your TikTok inbox, you tap Post (works for every app);
                           # direct = posts by itself (needs a TikTok app that passed TikTok's audit)
  tiktok_privacy: PUBLIC_TO_EVERYONE   # for direct mode
  tiktok_redirect_port: 8765           # must match the redirect URI in your TikTok app
  meta_api_version: v25.0
