# Brainrot Bot on a server (guide: docs/SERVER.md). First time:
#   mkdir data                               (made by you, so the bot's files are yours too)
#   docker compose run --rm brainrot --setup
# Then:
#   docker compose up -d
services:
  brainrot:
    build: .
    image: brainrot-bot
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data          # settings, logins, clips, gameplay, reels (output), speech model: all in ./data
    ports:
      - "8770:8770"           # the phone dashboard (only on a home network, or put it behind HTTPS)
    environment:
      TZ: Europe/London       # your time zone, so posts go out at the right times
      # BRAINROT_PUBLIC_URL: http://192.168.1.50:8770   # how your phone reaches this server
